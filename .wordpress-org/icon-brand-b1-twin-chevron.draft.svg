<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Brand Monogram Variant B1: Twin Chevron

  Concept: Two stacked chevrons (>>) evoking simultaneously
    (a) "Swift" — the fast-forward / media-player chevron suggests speed
    (b) "Duplicate" — the doubled mark reinforces the plugin's purpose

  Pure geometric mark, no letterforms, no UI illustration. Works as a logo
  on any surface — stickers, slides, favicons, marketing pages — not just
  in the WordPress plugin directory.

  Designed by Al Amin Ahamed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Swift Menu Duplicator">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#1E1B4B"/>
			<stop offset="100%" stop-color="#0B1220"/>
		</linearGradient>
		<linearGradient id="chevFront" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#22D3EE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<linearGradient id="chevBack" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E40AF"/>
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
			<feOffset dx="0" dy="3" result="off"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<!-- Squircle background -->
	<rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

	<!--
		Back chevron: behind, smaller, indigo gradient, offset up-left.
		Each chevron is a thick V opening to the right, built from two
		stroked diagonals meeting at the right edge.
	-->
	<g filter="url(#softShadow)" opacity="0.55">
		<path
			d="M 72 84 L 132 128 L 72 172"
			fill="none"
			stroke="url(#chevBack)"
			stroke-width="32"
			stroke-linecap="round"
			stroke-linejoin="round"/>
	</g>

	<!-- Front chevron: in front, full-size, cyan gradient, primary mark -->
	<g filter="url(#softShadow)">
		<path
			d="M 104 64 L 184 128 L 104 192"
			fill="none"
			stroke="url(#chevFront)"
			stroke-width="36"
			stroke-linecap="round"
			stroke-linejoin="round"/>
	</g>
</svg>
