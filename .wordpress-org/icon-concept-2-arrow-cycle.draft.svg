<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Icon Concept 2: Arrow Cycle
  256×256 master. Designed by Al Amin Ahamed.
  A single menu glyph wrapped by a circular duplication arrow — cleaner silhouette,
  less semantic specificity than concept 1 but stronger "motion" signal.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Swift Menu Duplicator">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0F172A"/>
			<stop offset="100%" stop-color="#0B1220"/>
		</linearGradient>
		<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E40AF"/>
		</linearGradient>
		<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#22D3EE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
			<feOffset dx="0" dy="3" result="off"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

	<!-- Cyan duplication arc, wrapping ~300° around the menu glyph -->
	<g transform="translate(128 128)">
		<!-- Arc path: starts at 30° (top-right), sweeps clockwise to 330° (top-left), leaving a gap at top -->
		<path d="
			M 78,-45
			A 90 90 0 1 1 -78,-45
		" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
		<!-- Arrowhead at end of arc (top-left side) -->
		<path d="M -78,-45 L -94,-58 L -68,-62 Z" fill="#22D3EE"/>
	</g>

	<!-- Central menu glyph card -->
	<g transform="translate(64 64)" filter="url(#softShadow)">
		<rect width="128" height="128" rx="20" ry="20" fill="url(#card)"/>
		<path d="M20 0 H108 A20 20 0 0 1 128 20 V36 H0 V20 A20 20 0 0 1 20 0 Z" fill="#FFFFFF" opacity="0.10"/>

		<!-- Three menu rows -->
		<rect x="20" y="30" width="74" height="10" rx="5" fill="#FFFFFF"/>
		<rect x="20" y="54" width="88" height="10" rx="5" fill="#FFFFFF"/>
		<rect x="20" y="78" width="62" height="10" rx="5" fill="#FFFFFF"/>
		<rect x="20" y="102" width="80" height="10" rx="5" fill="#FFFFFF"/>
	</g>
</svg>
