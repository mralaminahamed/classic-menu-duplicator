<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Icon Concept 3: Stacked Sheets with Anchor Row
  256×256 master. Designed by Al Amin Ahamed.
  Most minimal of the three. Two menu sheets, the front one with one row
  highlighted in cyan to evoke the "duplicate item" capability.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Swift Menu Duplicator">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0F172A"/>
			<stop offset="100%" stop-color="#0B1220"/>
		</linearGradient>
		<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E40AF"/>
		</linearGradient>
		<linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1E3A8A"/>
			<stop offset="100%" stop-color="#172554"/>
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
			<feOffset dx="0" dy="3" result="off"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

	<!-- Back sheet (slightly rotated and offset back-right) -->
	<g transform="translate(70 50) rotate(6 78 78)">
		<rect width="156" height="156" rx="22" ry="22" fill="url(#cardBack)" opacity="0.95"/>
		<rect x="22" y="34" width="92"  height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
		<rect x="22" y="58" width="112" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
		<rect x="22" y="82" width="78"  height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
		<rect x="22" y="106" width="98" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
	</g>

	<!-- Front sheet -->
	<g transform="translate(34 48)" filter="url(#softShadow)">
		<rect width="156" height="156" rx="22" ry="22" fill="url(#card)"/>
		<path d="M22 0 H134 A22 22 0 0 1 156 22 V44 H0 V22 A22 22 0 0 1 22 0 Z" fill="#FFFFFF" opacity="0.10"/>

		<rect x="22" y="34" width="92" height="12" rx="6" fill="#FFFFFF"/>
		<!-- Anchor row — highlighted in cyan to evoke "duplicate this item" -->
		<rect x="14" y="56" width="132" height="20" rx="10" fill="#22D3EE" opacity="0.18"/>
		<rect x="22" y="60" width="112" height="12" rx="6" fill="#22D3EE"/>
		<rect x="22" y="86" width="78"  height="12" rx="6" fill="#FFFFFF"/>
		<rect x="22" y="110" width="98" height="12" rx="6" fill="#FFFFFF"/>
	</g>
</svg>
