<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Mobile Banner (772×250)
  Direction: Brand Monogram (Twin Chevron).

  Composition (unified with desktop banner — see BRAND.md §4):
    - Oversized Twin Chevron mark on the left
    - Atmospheric glow centred on the mark
    - Two-line wordmark "Swift Menu" / "Duplicator" + cyan accent rule +
      single short tagline on the right
    - Credibility strip along the bottom edge

  Designed by Al Amin Ahamed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="772" height="250" role="img" aria-label="Swift Menu Duplicator mobile banner">
	<defs>
		<linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#1E1B4B"/>
			<stop offset="55%" stop-color="#0F172A"/>
			<stop offset="100%" stop-color="#0B1220"/>
		</linearGradient>
		<linearGradient id="chevFront" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#22D3EE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<linearGradient id="chevBack" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E40AF"/>
		</linearGradient>
		<linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#22D3EE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<filter id="markShadow" x="-10%" y="-10%" width="120%" height="120%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
			<feOffset dx="0" dy="6" result="off"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
		<pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
			<circle cx="1" cy="1" r="0.8" fill="#FFFFFF" opacity="0.05"/>
		</pattern>
	</defs>

	<!-- Background -->
	<rect width="772" height="250" fill="url(#bgGradient)"/>
	<rect width="772" height="250" fill="url(#dots)"/>

	<!-- Atmospheric glow — proportionally aligned to desktop (50% scale) -->
	<circle cx="190" cy="125" r="190" fill="#22D3EE" opacity="0.08"/>
	<circle cx="190" cy="125" r="110" fill="#3B82F6" opacity="0.10"/>

	<!-- ─────────── LEFT BLOCK: TWIN CHEVRON MARK ─────────── -->
	<!--
		Source icon coordinates × ~1.19. Mark visual height ~164px (~66% of
		canvas height), matches the desktop mark's canvas-height ratio.
	-->
	<g transform="translate(60 -5)" filter="url(#markShadow)">
		<g opacity="0.55">
			<path
				d="M 86 84 L 158 128 L 86 172"
				fill="none"
				stroke="url(#chevBack)"
				stroke-width="32"
				stroke-linecap="round"
				stroke-linejoin="round"/>
		</g>
		<path
			d="M 124 64 L 220 128 L 124 192"
			fill="none"
			stroke="url(#chevFront)"
			stroke-width="36"
			stroke-linecap="round"
			stroke-linejoin="round"/>
	</g>

	<!-- ─────────── RIGHT BLOCK: WORDMARK + TAGLINE ─────────── -->
	<!--
		Two-line wordmark mirrors desktop composition.
		Font: Inter ExtraBold 43px, line-height 48px, tracking -1.2.
		Anchor x=360 — proportionally consistent with desktop's x=720
		(both at ~46.6% of canvas width), giving a clean ~80px gap from the
		mark's right edge.
	-->
	<g transform="translate(360 89)">
		<text x="0" y="0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="43" letter-spacing="-1.2" fill="#FFFFFF">Swift Menu</text>
		<text x="0" y="48" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="43" letter-spacing="-1.2" fill="#FFFFFF">Duplicator</text>

		<!-- Cyan accent rule beneath the wordmark — 50% of desktop's 160px -->
		<rect x="0" y="60" width="80" height="3" rx="1.5" fill="url(#cyanGrad)"/>

		<!-- Short tagline (opacity matched to desktop 0.75) -->
		<text x="0" y="85" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#FFFFFF" opacity="0.75">Duplicate, snapshot, migrate WP menus.</text>
	</g>

	<!-- ─────────── BOTTOM CREDIBILITY STRIP ─────────── -->
	<!--
		Proper subset of the desktop strip — same tokens in the same order,
		with `WORDPRESS` abbreviated to `WP` for fit. GPL-2.0 dropped (not on
		desktop). WP-CLI retained as the developer-facing signal.
	-->
	<text x="360" y="232" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="10" letter-spacing="1.2" fill="#FFFFFF" opacity="0.45">
		PHP 7.4+  ·  WP 6.0+  ·  HPOS-SAFE  ·  WPML &amp; POLYLANG  ·  WP-CLI
	</text>

	<!-- Author signature -->
	<text x="740" y="244" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#FFFFFF" opacity="0.30">by Al Amin Ahamed</text>
</svg>
