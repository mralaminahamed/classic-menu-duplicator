<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Brand Monogram Variant B2: Stacked-S

  Concept: A bold "S" letterform with itself stacked behind, offset.
    "S" — the lead letter of "Swift" — becomes the brand mark.
    The doubled S with offset reinforces the duplication idea without
    requiring any literal menu illustration.

  The S is drawn as a custom geometric form (not from a typeface), so it
  scales cleanly at any size and reads as a logo rather than a typeset
  letter.

  Designed by Al Amin Ahamed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Swift Menu Duplicator">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#1E1B4B"/>
			<stop offset="100%" stop-color="#0B1220"/>
		</linearGradient>
		<linearGradient id="sFront" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#22D3EE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<linearGradient id="sBack" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E40AF"/>
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
			<feOffset dx="0" dy="4" result="off"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>

		<!--
			Reusable "S" mark. Drawn as a thick stroke with rounded caps,
			composed of two arcs forming the S curve. The path runs from
			top-right, curves down-left to a midpoint, then curves down-right
			to bottom-left.
		-->
		<symbol id="sMark" viewBox="0 0 120 160">
			<path
				d="M 100 30
				   C 100 12, 78 8, 60 8
				   C 30 8, 18 28, 18 46
				   C 18 70, 42 78, 60 82
				   C 78 86, 102 92, 102 116
				   C 102 138, 84 152, 60 152
				   C 38 152, 18 144, 18 124"
				fill="none"
				stroke="currentColor"
				stroke-width="28"
				stroke-linecap="round"
				stroke-linejoin="round"/>
		</symbol>
	</defs>

	<!-- Squircle background -->
	<rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

	<!-- Back S: behind, offset down-right, indigo gradient, dimmed -->
	<g transform="translate(96 60)" filter="url(#softShadow)" opacity="0.55" color="#1E3A8A">
		<use href="#sMark" width="120" height="160" style="color: url(#sBack)"/>
	</g>

	<!-- Front S: primary mark, cyan gradient -->
	<g transform="translate(68 48)" filter="url(#softShadow)" color="#22D3EE">
		<use href="#sMark" width="120" height="160" style="color: url(#sFront)"/>
	</g>
</svg>
