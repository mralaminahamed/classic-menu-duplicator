<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Plugin Icon (production master)

  Direction: Menu + Offset Copy.

  Two universally understood glyphs, combined:
    (a) three stacked bars on a card — the menu idiom every WordPress user
        already reads as "a navigation menu"
    (b) a second card offset behind it — the copy idiom every operating
        system uses for duplicate

  Together they state the plugin's whole promise in one shape: this menu,
  and a copy of it. Both halves are primitives (rounded rectangles), so the
  mark stays legible from 256px down to a 16px favicon, where illustrative
  icons collapse into mush.

  Construction grid (256×256 master):
    Squircle radius:  56px (22% of canvas)
    Back card:        x=96  y=52  w=108 h=132  r=16, indigo, 55% opacity
    Front card:       x=52  y=72  w=124 h=132  r=18, white
    Menu bars:        3 rounded bars inside the front card, cyan→sky
                      gradient, 14px tall, r=7, at y=104 / 132 / 160
                      widths 80 / 56 / 80 — the short middle bar keeps the
                      stack from reading as a plain document
    Background:       two-stop indigo → near-black gradient

  Design tokens are defined in .wordpress-org/BRAND.md — do not change
  colours, radii, or geometry without updating that document.

  Designed by Al Amin Ahamed <mrabir.ahamed@gmail.com>.
  License: GPL-2.0-or-later.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Swift Menu Duplicator">
	<title>Swift Menu Duplicator</title>

	<defs>
		<linearGradient id="swmd-bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0F172A"/>
			<stop offset="1" stop-color="#0B1220"/>
		</linearGradient>

		<linearGradient id="swmd-back-card" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#3B82F6"/>
			<stop offset="1" stop-color="#1E40AF"/>
		</linearGradient>

		<linearGradient id="swmd-bars" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#22D3EE"/>
			<stop offset="1" stop-color="#0EA5E9"/>
		</linearGradient>
	</defs>

	<!-- Background squircle -->
	<rect width="256" height="256" rx="56" fill="url(#swmd-bg)"/>

	<!-- Back card: the copy, sitting behind and to the upper right -->
	<rect x="96" y="52" width="108" height="132" rx="16" fill="url(#swmd-back-card)" opacity="0.55"/>

	<!-- Front card: the menu itself -->
	<rect x="52" y="72" width="124" height="132" rx="18" fill="#FFFFFF"/>

	<!-- Menu bars. The short middle bar stops the stack reading as a document. -->
	<rect x="74" y="104" width="80" height="14" rx="7" fill="url(#swmd-bars)"/>
	<rect x="74" y="132" width="56" height="14" rx="7" fill="url(#swmd-bars)"/>
	<rect x="74" y="160" width="80" height="14" rx="7" fill="url(#swmd-bars)"/>
</svg>
