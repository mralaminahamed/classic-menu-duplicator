<?xml version="1.0" encoding="UTF-8"?>
<!--
  Swift Menu Duplicator — Plugin Icon (production master)

  Direction: Brand Monogram — Twin Chevron.

  Two stacked chevrons (>>) carry two simultaneous meanings:
    (a) "Swift" — the chevron is the universal fast-forward / forward-motion
        glyph; doubled, it reads as "fast"
    (b) "Duplicate" — the second chevron offset behind the first reinforces
        the duplication idea without requiring any literal menu illustration

  This is a brand mark, not a UI illustration. It works at any scale, in
  any context — favicon, sticker, slide deck, marketing site — and ages
  well because it does not depend on current WordPress admin UI styling.

  Construction grid (256×256 master):
    Squircle radius:     56px (22% of canvas)
    Front chevron:       stroked V, path apex at (184,128), endpoints
                         (104,64) and (104,192). Stroke width 36px, round
                         caps and joins. Cyan-to-sky gradient.
    Back chevron:        same shape scaled to 75%, offset up-left, indigo
                         gradient, opacity 0.55. Apex at (132,128).
    Background:          two-stop indigo-to-near-black gradient.

  Design tokens are defined in .wordpress-org/BRAND.md — do not change
  colours, stroke widths, or geometry without updating that document.

  Designed by Al Amin Ahamed <mrabir.ahamed@gmail.com>.
  License: GPL-2.0-or-later.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Swift Menu Duplicator">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#1E1B4B"/>
			<stop offset="100%" stop-color="#0B1220"/>
		</linearGradient>
		<linearGradient id="chevFront" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#22D3EE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<linearGradient id="chevBack" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%"  stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E40AF"/>
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
			<feOffset dx="0" dy="3" result="off"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<!-- Squircle background -->
	<rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

	<!-- Back chevron: dimmed, offset up-left, indigo gradient -->
	<g filter="url(#softShadow)" opacity="0.55">
		<path
			d="M 72 84 L 132 128 L 72 172"
			fill="none"
			stroke="url(#chevBack)"
			stroke-width="32"
			stroke-linecap="round"
			stroke-linejoin="round"/>
	</g>

	<!-- Front chevron: primary mark, cyan gradient -->
	<g filter="url(#softShadow)">
		<path
			d="M 104 64 L 184 128 L 104 192"
			fill="none"
			stroke="url(#chevFront)"
			stroke-width="36"
			stroke-linecap="round"
			stroke-linejoin="round"/>
	</g>
</svg>
