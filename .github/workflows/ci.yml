name: CI

# Every push and pull request against trunk. Until now this repository had no CI
# at all: correctness rested on whoever opened the pull request having run the
# suite locally, and nothing stopped a red commit from being merged.

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

# Read-only. CI checks out, installs and tests; it never writes to the
# repository, and the default token permission for a repo can be read/write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — lint
  # PHP CodeSniffer against the WordPress standard.
  # ---------------------------------------------------------------------------
  lint:
    name: "PHP Lint (PHPCS)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php74-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php74-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP CodeSniffer
        run: composer lint

  # ---------------------------------------------------------------------------
  # JOB 2 — analyze
  # PHPStan at the level configured in phpstan.neon.
  # ---------------------------------------------------------------------------
  analyze:
    name: "PHP Static Analysis (PHPStan)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php74-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php74-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer analyze

  # ---------------------------------------------------------------------------
  # JOB 3 — test
  # PHPUnit against a real WordPress install, across the PHP version matrix.
  # ---------------------------------------------------------------------------
  test:
    name: "PHP Tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the plugin header declares; 8.5 is what development
        # happens on. The versions in between are the ones real sites run.
        php:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_phpunit_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, json, zip
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress for testing
        # The suite boots real WordPress — it is an integration suite, not a
        # mocked one — so core has to be on disk before PHPUnit starts.
        run: |
          wget -q -O /tmp/wordpress.tar.gz https://wordpress.org/latest.tar.gz
          mkdir -p /tmp/wordpress
          tar xzf /tmp/wordpress.tar.gz -C /tmp/wordpress --strip-components=1

      - name: Run PHPUnit
        env:
          WP_DB_NAME:      wp_phpunit_tests
          WP_DB_USER:      root
          WP_DB_PASS:      root
          WP_DB_HOST:      127.0.0.1
          WP_PHPUNIT__DIR: vendor/wp-phpunit/wp-phpunit
          WP_PATH:         /tmp/wordpress
        run: composer test

  # ---------------------------------------------------------------------------
  # JOB 4 — js
  # ESLint and Stylelint over the admin scripts and styles. There is no build
  # step: the plugin ships plain JS and CSS.
  # ---------------------------------------------------------------------------
  js:
    name: "JS & CSS Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint:js

      - name: Run Stylelint
        run: yarn lint:css
