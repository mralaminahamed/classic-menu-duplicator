name: Release Plugin to WP.org

on:
  push:
    tags:
      - "*"
  # Manual re-run, for when a tag push produced no run (Actions disabled at the
  # time, an outage, or a deploy that needs repeating). Dispatch against the
  # tag itself — `gh workflow run svn-deploy.yml --ref 1.1.0` — or pass the tag
  # explicitly when dispatching from a branch.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to the ref this runs on)'
        required: false
        type: string

permissions:
  contents: write # needed to create GitHub release

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set plugin name
        id: plugin_name
        run: |
          # Pinned to the published WordPress.org slug so the deploy targets the
          # correct SVN repo and main plugin file regardless of the GitHub repo name.
          PLUGIN_SLUG="swift-menu-duplicator"
          PLUGIN_FILE="${PLUGIN_SLUG}.php"
          # Convert kebab-case to Title Case for display
          PLUGIN_NAME=$(echo "$PLUGIN_SLUG" | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
          echo "plugin_slug=$PLUGIN_SLUG" >> $GITHUB_OUTPUT
          echo "plugin_file=$PLUGIN_FILE" >> $GITHUB_OUTPUT
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT

      - name: Validate tag and plugin version alignment
        id: version_check
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG_REF="${INPUT_TAG}"
          else
            TAG_REF="${GITHUB_REF#refs/tags/}"
          fi
          # A dispatch from a branch with no tag input has nothing to validate.
          if [ "${TAG_REF}" = "${GITHUB_REF}" ]; then
            echo "Not a tag ref and no tag input supplied — pass one via workflow_dispatch." >&2
            exit 1
          fi
          # Strip leading v if present
          if [[ "$TAG_REF" =~ ^v ]]; then TAG_STRIPPED=${TAG_REF#v}; else TAG_STRIPPED=$TAG_REF; fi
          # Extract Version from plugin header (first match)
          PLUGIN_VERSION=$(grep -E "^[[:space:]]*\*[[:space:]]*Version:" ${{ steps.plugin_name.outputs.plugin_file }} | head -n1 | sed -E 's/.*Version:[[:space:]]*([^ ]+).*/\1/')
          echo "Tag: $TAG_REF";
          echo "Stripped Tag: $TAG_STRIPPED";
          echo "Plugin Version: $PLUGIN_VERSION";
          if [ -z "$PLUGIN_VERSION" ]; then echo "Could not determine plugin version from ${{ steps.plugin_name.outputs.plugin_file }}"; exit 1; fi
          if [ "$PLUGIN_VERSION" != "$TAG_STRIPPED" ]; then echo "Version mismatch: tag ($TAG_STRIPPED) != plugin header ($PLUGIN_VERSION)"; exit 1; fi
          echo "version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT

      - name: Ensure composer.lock is present
        run: |
          if [ ! -f composer.lock ]; then
            echo "composer.lock is missing. Please commit it before tagging a release." >&2
            exit 1
          fi

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies (with dev for build tooling)
        run: |
          composer install --no-interaction --prefer-dist

      - name: Optimize production autoloader (remove dev deps)
        run: |
          composer install --no-dev --no-interaction --prefer-dist -o

      - name: "Guard: composer.lock unchanged after build"
        run: |
          if ! git diff --quiet --exit-code composer.lock; then
            echo "composer.lock changed during build. Commit updated lock file before release." >&2
            git --no-pager diff composer.lock | head -n 100
            exit 1
          fi

      - name: Install SVN (Subversion)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y subversion

      # Stage a curated .wordpress-org/ payload that excludes design drafts
      # (*.draft.svg) and internal docs (BRAND.md), then point the 10up
      # deploy action at the staged directory via the ASSETS_DIR env var.
      # The plugin ZIP itself is unaffected — .distignore already excludes
      # the entire /.wordpress-org/ folder from the code payload.
      - name: Stage WordPress.org assets
        run: bash resources/scripts/stage-wp-org-assets.sh

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ steps.plugin_name.outputs.plugin_slug }}
          ASSETS_DIR: .wp-org-staged

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ steps.version_check.outputs.version }}
          body: |
            Release ${{ steps.version_check.outputs.version }} of ${{ steps.plugin_name.outputs.plugin_name }}.

            Full changelog: https://wordpress.org/plugins/swift-menu-duplicator/#developers
            (mirrored in readme.txt).
          files: ${{ steps.deploy.outputs.zip-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
