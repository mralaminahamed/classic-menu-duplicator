name: Plugin asset/readme update
on:
  push:
    branches:
      - trunk
    # Negative patterns (prefixed !) prevent runs triggered solely by working
    # files inside .wordpress-org/ that never reach WordPress.org SVN anyway.
    paths:
      - '.wordpress-org/**'
      - '!.wordpress-org/*.draft.svg'
      - '!.wordpress-org/BRAND.md'
      - '!.wordpress-org/README.md'
      - 'readme.txt'

jobs:
  trunk:
    name: Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Stage a curated assets directory that excludes design drafts
      # (*.draft.svg) and internal docs (BRAND.md). The 10up asset action
      # has no .distignore equivalent for the assets folder, so the
      # filtering happens here and the action is pointed at the staged dir.
      - name: Stage WordPress.org assets
        run: bash bin/stage-wp-org-assets.sh

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true
          ASSETS_DIR: .wp-org-staged
