# Build the WordPress.org brand assets (icon + banners) from their sources and
# surface the resulting PNGs as a workflow artifact.
#
# The icon comes from .wordpress-org/icon.svg and the banners from
# resources/brand/banner.html; both are rendered by Playwright — see
# .wordpress-org/BRAND.md §6. Screenshots are NOT built here: they are captured
# from a live WordPress admin, which CI has no access to.
#
# Trigger:
#   - on push to trunk when a source or the rendering spec changes
#   - manually via workflow_dispatch
#   - as a reusable workflow (workflow_call) so the release pipeline can chain
#     this job in front of the SVN deploy step
#
# Author: Al Amin Ahamed <mrabir.ahamed@gmail.com>

name: Build brand assets

on:
  push:
    branches: [ trunk ]
    paths:
      - '.wordpress-org/icon.svg'
      - 'resources/brand/**'
      - 'tests/e2e/assets/wporg-brand.spec.ts'
      - 'playwright*.config.ts'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: 'Name of the uploaded brand-assets artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: brand-assets-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "Render: icon + banners"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The local pipeline uses `channel: 'chrome'` so contributors do not need
      # a browser download; CI has no Chrome, so install Playwright's Chromium
      # and point the run at it.
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      # The config asks for `channel: 'chrome'`; the runner image ships Google
      # Chrome, so this resolves without a browser download. Chromium is
      # installed above as a fallback for images that do not.
      - name: Render brand assets
        run: yarn playwright test --config=playwright.wporg-shots.config.ts --project=brand

      - name: Verify output dimensions
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y imagemagick
          check() {
            actual="$(identify -format '%wx%h' "$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 is $actual, expected $2"
              exit 1
            fi
            echo "$1 $actual OK"
          }
          check .wordpress-org/icon-256x256.png 256x256
          check .wordpress-org/icon-128x128.png 128x128
          check .wordpress-org/banner-1544x500.png 1544x500
          check .wordpress-org/banner-772x250.png 772x250

      - name: Name the artifact
        id: meta
        run: echo "artifact-name=brand-assets-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload brand assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: |
            .wordpress-org/icon-*.png
            .wordpress-org/banner-*.png
          # .wordpress-org is a dotted directory, and upload-artifact skips
          # hidden paths by default — the render succeeded and the upload then
          # found nothing.
          include-hidden-files: true
          if-no-files-found: error
